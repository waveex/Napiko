# Lokalne środowisko OXY: PostgreSQL, magazyn plików S3 (MinIO) i testowa skrzynka pocztowa (Mailpit).
#   pnpm infra:up     – uruchom
#   pnpm infra:down   – zatrzymaj (dane zostają w wolumenach)
name: oxy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oxy"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Serwer S3 (pliki). Obrazy MinIO zniknęły z Docker Hub i z quay.io (09.2026), dlatego RustFS.
  # Nazwa usługi zostaje "minio", żeby nic innego nie trzeba było zmieniać.
  minio:
    image: rustfs/rustfs:latest
    # root, żeby wolumen był zapisywalny bez dodatkowych kroków (tylko lokalne środowisko)
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: oxy
      RUSTFS_SECRET_KEY: oxy-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # Pozwala przeglądarce wysyłać pliki bezpośrednio przez podpisane adresy URL
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # konsola www
    volumes:
      - rustfsdata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # skrzynka www: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  pgdata:
  rustfsdata:
